name: Reels

on:
  push:
    branches: [main]
    paths:
      - "video/cola/**"
  workflow_dispatch:

concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: video
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Preparar navegador de Remotion
        run: npx remotion browser ensure

      - name: Renderizar y subir reels
        run: node render.mjs

      - name: Guardar resultados
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A video/salida
          if git diff --cached --quiet; then
            echo "No hay resultados nuevos"
            exit 0
          fi
          git commit -m "Reels renderizados: actualiza video/salida"
          for intento in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
