name: Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Comprobar secretos
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Faltan SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD o SUPABASE_PROJECT_ID, no se despliega nada"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.cfg.outputs.ok == 'true'
        with:
          bun-version: 1.4.3

      - name: Pruebas
        if: steps.cfg.outputs.ok == 'true'
        run: |
          bun install --frozen-lockfile
          bun run test

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: latest

      - name: Enlazar proyecto
        if: steps.cfg.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migraciones pendientes
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --dry-run

      - name: Aplicar migraciones
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push

      - name: Desplegar funcion publicar
        if: steps.cfg.outputs.ok == 'true'
        run: supabase functions deploy publicar --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
